<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ElectroSim – Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
<header class="top">
  <a class="brand" href="index.html" title="Back to home"><span class="logo">⚡</span><b>Electro<i>Sim</i></b></a>
  <div class="grp">
    <button class="run" id="bRun"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Run</button>
    <button id="bPause"><svg viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg>Pause</button>
    <button class="stop" id="bStop"><svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z" fill="currentColor"/></svg>Stop</button>
  </div>
  <span class="sp"></span>
  <div class="grp">
    <button id="bPdf">Export PDF</button><button id="bSave">Save</button><button id="bLoad">Load</button><button id="bReset">Reset</button>
  </div>
  <span id="stat">STOPPED</span>
</header>

<aside id="lib">
  <div class="srch"><input id="q" type="search" placeholder="Search components…" autocomplete="off"></div>
  <div id="libList"></div>
</aside>

<div id="stage">
  <div id="cv"><svg id="svg" viewBox="0 0 1175 845" width="1175" height="845"></svg></div>
  <div class="zoom"><button id="zo" title="Zoom out">−</button><span id="zl">100%</span><button id="zi" title="Zoom in">+</button><button id="zf" title="Fit to window">Fit</button></div>
</div>

<aside id="props"></aside>

<footer>
  <div><table><thead><tr><th>Component</th><th>Voltage</th><th>Current</th><th>Power</th><th>State</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div id="msgs"></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/parts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
