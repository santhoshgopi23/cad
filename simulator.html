<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ElectroSim – Simulator</title>
<meta name="theme-color" content="#0a2350">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ElectroSim">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
<header class="top">
  <a class="brand" href="index.html" title="Back to home"><span class="logo">⚡</span><b>Electro<i>Sim</i></b></a>
  <div class="grp">
    <button class="run" id="bRun" aria-label="Run"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span class="lb">Run</span></button>
    <button id="bPause" aria-label="Pause"><svg viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg><span class="lb">Pause</span></button>
    <button class="stop" id="bStop" aria-label="Stop"><svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z" fill="currentColor"/></svg><span class="lb">Stop</span></button>
  </div>
  <span class="sp"></span>
  <div class="grp" id="menu">
    <button id="bPdf">Export PDF</button><button id="bSave">Save</button><button id="bLoad">Load</button><button id="bReset">Reset</button>
    <button data-install hidden>Install app</button>
    <a class="mi" href="index.html">About ElectroSim</a>
  </div>
  <span id="stat">STOPPED</span>
  <button id="bMenu" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.6" fill="currentColor"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><circle cx="8" cy="13" r="1.6" fill="currentColor"/></svg></button>
</header>

<aside id="lib">
  <div class="srch"><input id="q" type="search" placeholder="Search components…" autocomplete="off" enterkeyhint="search"></div>
  <div id="libList"></div>
</aside>

<div id="stage">
  <div id="cv"><svg id="svg" viewBox="0 0 1175 845" width="1175" height="845"></svg></div>
  <div class="zoom"><button id="zo" title="Zoom out" aria-label="Zoom out">−</button><span id="zl">100%</span><button id="zi" title="Zoom in" aria-label="Zoom in">+</button><button id="zf" title="Fit to window">Fit</button></div>
  <div id="hint">Tap empty space to add a bend · tap a terminal to finish the wire</div>
  <div id="fab">
    <button id="fRot" aria-label="Rotate selected part"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Rotate</button>
    <button id="fEdit" aria-label="Edit properties"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Edit</button>
    <button id="fDel" class="danger" aria-label="Delete selected"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Delete</button>
    <button id="fCancel" aria-label="Cancel wire"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Cancel wire</button>
  </div>
</div>

<aside id="props"></aside>

<footer>
  <div><table><thead><tr><th>Component</th><th>Voltage</th><th>Current</th><th>Power</th><th>State</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div id="msgs"></div>
</footer>

<button id="sheetX" aria-label="Close panel">✕</button>
<nav id="tabs">
  <button data-sheet="lib"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><path d="M16.7 13.5v6.5M13.5 16.7H20"/></svg>Parts</button>
  <button data-sheet="props"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>Properties</button>
  <button data-sheet="res"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Results<i id="badge"></i></button>
</nav>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="js/parts.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
